    <!-- BOT PROTECTION & SINGLE SUBSCRIBE (WITH EVENT ID DEDUPLICATION) -->
    <!-- ============================================================== -->
    <script>
        (function () {
            'use strict';

            var joinBtn = document.getElementById('joinBtn');
            var lockCountEl = document.getElementById('lockCount');
            var hasInteracted = false;
            var subscribeFired = false;

            // --- 1. HUMAN INTERACTION TRACKER ---
            var pixelTriggerEvents = ['scroll', 'mousemove', 'touchstart', 'keydown'];

            function handleHumanInteraction() {
                if (hasInteracted) return;
                hasInteracted = true;
                console.log('Human interaction detected.');
                pixelTriggerEvents.forEach(function (evt) {
                    document.removeEventListener(evt, handleHumanInteraction, { passive: true });
                });
            }

            pixelTriggerEvents.forEach(function (evt) {
                document.addEventListener(evt, handleHumanInteraction, { passive: true, once: true });
            });

            // --- 2. TIMER BARRIER (5 SECONDS) ---
            var lockDuration = 5;
            var remaining = lockDuration;

            function updateLockDisplay() {
                if (!lockCountEl) return;
                lockCountEl.textContent = '(' + remaining + ')';
            }

            function unlockButton() {
                joinBtn.classList.remove('locked');
                joinBtn.removeAttribute('data-locked');
                if (lockCountEl) {
                    lockCountEl.textContent = '';
                    lockCountEl.style.display = 'none';
                }
            }

            updateLockDisplay();

            var lockInterval = setInterval(function () {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(lockInterval);
                    unlockButton();
                    return;
                }
                updateLockDisplay();
            }, 1000);

            // --- 3. CLICK PROTECTION & SINGLE SUBSCRIBE WITH DEDUPLICATION ID ---
            if (joinBtn) {
                joinBtn.addEventListener('click', function (e) {
                    var honeypot = document.getElementById('website_url').value;

                    if (honeypot !== '') {
                        console.warn('🚫 Bot blocked: Honeypot.');
                        return;
                    }
                    if (joinBtn.classList.contains('locked') || remaining > 0) {
                        console.warn('🚫 Bot blocked: Timer not passed.');
                        return;
                    }
                    if (!hasInteracted) {
                        console.warn('🚫 Bot blocked: No human interaction.');
                        return;
                    }

                    // Human confirmed - Fire Subscribe ONCE
                    if (!subscribeFired) {
                        subscribeFired = true;
                        
                        if (typeof fbq !== 'undefined') {
                            // Generate a unique Event ID to stop double counting
                            var uniqueEventId = 'sub_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                            
                            fbq('track', 'Subscribe', {
                                content_name: 'டிராகன் டைகர் (தமிழ்)',
                                content_category: 'Telegram Channel'
                            }, { eventID: uniqueEventId });
                            
                            console.log('✅ Human confirmed. Subscribe fired with Event ID: ' + uniqueEventId);
                        }
                    }

                    // Open Telegram link
                    window.open(joinBtn.getAttribute('data-url'), '_blank');
                });
            }
        })();
    </script>
